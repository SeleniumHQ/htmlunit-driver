name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  seed-cache:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '21' ]
      fail-fast: false

    name: Java ${{ matrix.Java }} seed dependencies
    env:
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: '5'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Seed the Maven cache
        run: mvn -B dependency:go-offline dependency:resolve-plugins -Prelease

  build:
    needs: seed-cache
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17', '21' ]
      fail-fast: false

    name: Java ${{ matrix.Java }} test and verify
    env:
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: '5'
    steps:
      - uses: actions/checkout@v7
        
      - name: Ensure Xvfb is installed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            echo "Installing Xvfb..."
            sudo apt-get update
            sudo apt-get install -y xvfb
          else
            echo "xvfb-run already installed"
          fi

          xvfb-run --version || true


      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Cache NVD Database
        id: cache-nvd
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-cache-${{ runner.os }}-${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}-${{ github.run_id }}
          restore-keys: |
            nvd-cache-${{ runner.os }}-${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
            nvd-cache-${{ runner.os }}-${{ matrix.java }}
            nvd-cache-${{ runner.os }}-

      - name: Get Versions
        run: |
          echo "Google chrome version"
          google-chrome --version
          echo "firefox version"
          firefox --version
          echo "temp folder: ${{ runner.temp }}"

      - name: Build with Maven with X Frame Buffer
        run:  xvfb-run mvn --batch-mode --update-snapshots verify -Djava.io.tmpdir=${{ runner.temp }}
        env:
            NVD_NIST_APIKEY: ${{ secrets.NVD_NIST_APIKEY}}

      - name: Package artifacts
        run: |
         mkdir staging
         cp -rf target/*.jar staging
         cp -rf target/*reports staging
         cp -rf target/bom.json staging/bom.json

      - name: Upload artifacts ${{ matrix.java }}
        uses: actions/upload-artifact@v7
        with:
          name: Package ${{ matrix.java }}
          path: staging
          overwrite: true

      - name: Cache NVD Database
        uses: actions/cache/save@v6
        if: ${{ always() }}
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-cache-${{ runner.os }}-${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}-${{ github.run_id }}

      - name: Test Summary ${{ matrix.java }}
        uses: test-summary/action@v2.6
        continue-on-error: true
        if: always()
        with:
          paths: "target/*-reports/TEST-*.xml"
          output: test-summary.md
      
      
      - name: Upload test summary ${{ matrix.java }}
        uses: actions/upload-artifact@v7
        with:
          name: test-summary ${{ matrix.java }}
          path: test-summary.md
        if: always()

  owasp:
    needs: seed-cache
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '21' ]
      fail-fast: false

    name: OWASP check jdk${{ matrix.Java }}
    env:
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: '5'
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Cache NVD Database
        id: cache-nvd
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-cache-${{ runner.os }}-owasp-${{ github.run_id }}
          restore-keys: |
            nvd-cache-${{ runner.os }}-owasp-
            nvd-cache-${{ runner.os }}-

      - name: OWASP Dependency check
        run:  mvn org.owasp:dependency-check-maven:check -Powasp-nvd-mirror
        env:
            NVD_NIST_APIKEY: ${{ secrets.NVD_NIST_APIKEY}}

      - name: Cache NVD Database
        uses: actions/cache/save@v6
        if: ${{ always() }}
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-cache-${{ runner.os }}-owasp-${{ github.run_id }}
